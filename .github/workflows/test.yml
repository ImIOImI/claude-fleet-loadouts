name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships git, jq, flock and mikefarah yq (build-index.test.sh needs yq).
      - name: Run tests
        run: make test
